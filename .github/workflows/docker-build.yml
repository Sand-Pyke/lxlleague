name: Build and Push to ACR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-i9zdaj7focplqv2n.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 构建并推送 app 镜像（默认最后一个 stage：runtime）
      - name: Build and push App image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: crpi-i9zdaj7focplqv2n.cn-hangzhou.personal.cr.aliyuncs.com/lol-champion/lxleague:app
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 构建并推送 migrate 镜像（必须指定 target: migrate）
      - name: Build and push Migrate image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: migrate
          push: true
          tags: crpi-i9zdaj7focplqv2n.cn-hangzhou.personal.cr.aliyuncs.com/lol-champion/lxleague:migrate
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max