version: "1.0"
name: 流水线-202609170905
displayName: 流水线-202609170905
stages:
- name: build
  displayName: Build release
  strategy: naturally
  trigger: auto
  steps:
  - step: build@nodejs
    displayName: Node 20 build and verify
    nodeVersion: 20.19.0
    commands:
      - npm config set registry https://registry.npmmirror.com
      - npm ci
      - npm run db:generate
      - npx tsc --noEmit --incremental false
      - NODE_OPTIONS=--max-old-space-size=4096 npm run build
      - rm -rf .release
      - mkdir .release
      - cp -R Dockerfile docker-compose.yml docker-compose.prod.yml .dockerignore .env.example package.json package-lock.json next.config.ts tsconfig.json next-env.d.ts prisma public src .release/
    artifacts:
      - name: BUILD_ARTIFACT
        path:
          - ./.release
        type: .tar.gz
    caches:
      - "~/.npm"
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
triggers:
  trigger: auto
  push:
    branches:
      prefix:
      - ""
      precise: []
      include: []
notify: []
