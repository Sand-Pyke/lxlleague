version: "1.0"
name: build-and-deploy-lxl
displayName: Build and deploy LXL
stages:
  - name: build
    displayName: Build release
    strategy: naturally
    trigger: auto
    steps:
      - step: build@nodejs
        displayName: Node 20 build
        nodeVersion: 20.19.0
        commands:
          - npm ci
          - npm run db:generate
          - npm run build
          - rm -rf .release
          - mkdir .release
          - cp -R Dockerfile docker-compose.yml .dockerignore .env.example package.json package-lock.json next.config.ts tsconfig.json next-env.d.ts prisma public src .release/
        artifacts:
          - name: BUILD_ARTIFACT
            path:
              - ./.release
            type: .tar.gz
        caches:
          - "~/.npm"
        notify: []
        strategy:
          retry: "0"
          resource:
            cpu: "2"
            memory: "4"
  - name: deploy
    displayName: Deploy with Docker Compose
    strategy: naturally
    trigger: auto
    steps:
      - step: deploy@agent
        displayName: Host deployment
        deployArtifact:
          - name: BUILD_ARTIFACT
            target: "~/gitee_go/deploy/lol-champion"
            source: build
            dependArtifact: BUILD_ARTIFACT
            artifactRepository: default
            artifactName: BUILD_ARTIFACT
            artifactVersion: latest
        script: |-
          set -eu
          cd ~/gitee_go/deploy/lol-champion
          test -f .env || { echo "Missing .env. Copy .env.example and set production secrets on the host first."; exit 1; }
          docker compose --env-file .env up -d --build --remove-orphans
        hostGroupID: {}
        notify: []
        strategy:
          retry: "0"
triggers:
  trigger: manual
notify: []
strategy:
  blocking: true
